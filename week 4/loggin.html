<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">
        
    <form onsubmit="verifyUser(event)">
    <label for="usernameInput">Username</label>
    <input type="text" id="usernameInput" placeholder="Enter username">
    <br><br>

    <label for="passwordInput">Password</label>
    <input type="password" id="passwordInput" placeholder="Enter password">
    <br><br>

    <p id="message"></p>

    <button  >Login</button>
</form>

</div>

<a href="" onclick="verifyUser()">nbn</a>

<script>
    function verifyUser() {
        event.preventDefault(); // Prevent form from submitting normally

        var username = document.getElementById("usernameInput").value;
        var password = document.getElementById("passwordInput").value;

        checkUserCreds(username, password);
    }

    function checkUserCreds(username, password) {
        var systemUsername = "Bond";
        var systemPassword = "007";

        if (username === systemUsername && password === systemPassword) {
            document.getElementById("message").innerHTML = "Correct. Logging you in…";
        } else {
            document.getElementById("message").innerHTML = "Incorrect username or password.";
        }
    }
</script>
</body>
</html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="weather">What's the weather like?</label>
<select id="weather">
    <option value="sunny">Sunny</option>
    <option value="windy">Windy</option>
    <option value="rainy">Rainy</option>
    <option value="snow">Snow</option>
    <option value="cloudy">Cloudy</option>
</select>

<a href="#" onclick="btnPressed()">GO!</a>

<p id="outputText">Weather advice: </p>

    <script>
    function btnPressed() {

        var weatherSelected = document.getElementById("weather").value;
        var advice;

        switch (weatherSelected) {
            case "sunny":
                advice = "Wear sunglasses and stay hydrated.";
                break;
            case "windy":
                advice = "Hold onto your hat!";
                break;
            case "rainy":
                advice = "Take an umbrella.";
                break;
            case "snow":
                advice = "Bundle up and watch your step.";
                break;
            case "cloudy":
                advice = "Might be a bit gloomy—perfect for reading indoors.";
                break;
            default:
                advice = "Pick a weather type.";
        }

        document.getElementById("outputText").innerHTML = "Weather advice: " + advice;
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table border="1">
        <tr >
            <td colspan="4">
            <input type="text" id="inputBox" value="0">
            </td>
        </tr>
        <tr>
            <td onclick="digitBtnPress(7)">7</td>
            <td onclick="digitBtnPress(8)">8</td>
            <td onclick="digitBtnPress(9)">9</td>
            <td onclick="opBtnPressd('x')">x</td>
        </tr>
        <tr>
            <td onclick="digitBtnPress(4)">4</td>
            <td onclick="digitBtnPress(5)">5</td>
            <td onclick="digitBtnPress(6)">6</td>
            <td onclick="opBtnPressd('-')">-</td>
        </tr>
        <tr>
            <td onclick="digitBtnPress(1)">1</td>
            <td onclick="digitBtnPress(2)">2</td>
            <td onclick="digitBtnPress(3)">3</td>
            <td onclick="opBtnPressd('+')">+</td>
        </tr>
        <tr>
            <td colspan="2" onclick="digitBtnPress(0)">0</td>
            <td colspan="1" onclick="btnAc()" >AC</td>
            <td colspan="1" onclick="opBtnPressd('d')">\</td>
            
        </tr>

        <tr>
            <td colspan="4" onclick="equalsbtn()">=</td>
        </tr>
    </table>

    <!-----------------------------------JAVA------------------------->
    <script>
        var newLine = true;
        var value1 ;
        var currentOperator ;
        

        function digitBtnPress(button){
            if(newLine == true){
                document.getElementById("inputBox").value = button;
                newLine = false;

            }else{
                var currentValue = document.getElementById("inputBox").value
            document.getElementById("inputBox").value = currentValue + button ;
            }
        }

        function btnAc(){
            document.getElementById("inputBox").value = 0;
            newLine = true;
        }

        function opBtnPressd(operator){
            currentOperator = operator;
            value1 = parseInt(document.getElementById("inputBox").value);
            newLine = true;
        }

        function equalsbtn(){
            var value2 = parseInt(document.getElementById("inputBox").value);
            var finalTot ;

            switch(currentOperator){
                case "+": finalTot = value1 + value2;
                break;
                case "-": finalTot = value1 - value2;
                break;
                case "x": finalTot = value1 * value2;
                break;
                case "d": finalTot = value1 / value2;
                break;
            }
            document.getElementById("inputBox").value = finalTot;

            value1 = 0;
            newLine = true ;

        }

    </script>
    
</body>
</html>
